[project]
name = "superpowers-backplane"
version = "1.0.0.dev0"
description = "Python core for Superpowers Backplane's issue-backed SDD graph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
backplane = "superpowers_backplane.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.12.11",
    "ty==0.0.69",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
