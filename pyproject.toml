[project]
name = "superpowers-backplane-dev"
version = "0.1.0"
description = "Development checks for the Superpowers Backplane skill companion"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.13.5"
python-preference = "only-managed"

[dependency-groups]
dev = [
    "uv==0.13.7",
    "ruff==0.17.4",
    "ty==0.0.99",
    "pre-commit==4.7.0",
]
hygiene = [
    "bandit==1.9.4",
    "cohesion==1.2.0",
    "cosmic-ray==8.7.0",
    "coverage==7.17.2",
    "interrogate==1.7.0",
    "lizard==1.25.1",
    "pip-audit==2.10.1",
    "vulture==2.16",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# Preserve approved/historical Markdown bytes. Guide Python is compiled by unittest.
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"

